name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Align unsigned release and collect signer
        shell: bash
        run: |
          mkdir -p release-tools
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4             app/build/outputs/apk/release/app-release-unsigned.apk             release-tools/BilancioMensile-1.1.0-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-tools/

      - name: Upload aligned release and signer
        uses: actions/upload-artifact@v4
        with:
          name: BilancioMensile-1.1.0-release-tools
          path: release-tools/
          if-no-files-found: error
          retention-days: 1
